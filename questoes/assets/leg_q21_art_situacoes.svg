<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><rect width="900" height="340" fill="white"/><text x="450" y="32" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Três fatos administrativos distintos</text><g font-family="Arial" font-size="17" text-anchor="middle"><rect x="65" y="85" width="225" height="150" rx="10" fill="#e4f5df" stroke="#0b5e42" stroke-width="3"/><text x="177" y="130">Atividade executada</text><text x="177" y="158">e participação</text><text x="177" y="186">encerrada</text><rect x="338" y="85" width="225" height="150" rx="10" fill="#fff0b8" stroke="#8a6d00" stroke-width="3"/><text x="450" y="130">Contrato registrado,</text><text x="450" y="158">mas atividade</text><text x="450" y="186">não iniciada</text><rect x="610" y="85" width="225" height="150" rx="10" fill="#ffd6d2" stroke="#c72218" stroke-width="3"/><text x="722" y="130">Registro contém</text><text x="722" y="158">irregularidade</text><text x="722" y="186">invalidante</text></g><text x="450" y="285" text-anchor="middle" font-family="Arial" font-size="17">Qual instituto corresponde a cada fato?</text></svg>