  <rect x="245" y="55" width="155" height="125" rx="8" class="box"/><text x="295" y="108" class="t">DR</text><text x="272" y="137" class="s">2 polos</text>
  <line x1="400" y1="85" x2="520" y2="85" class="f"/><line x1="400" y1="145" x2="520" y2="145" class="n"/>
  <rect x="520" y="52" width="125" height="108" rx="8" class="box"/><text x="540" y="87" class="s">Circuito 1</text><text x="548" y="118" class="s">F e N</text>
  <rect x="700" y="205" width="130" height="108" rx="8" class="box"/><text x="720" y="240" class="s">Circuito 2</text><text x="728" y="271" class="s">F e N</text>
  <line x1="475" y1="85" x2="475" y2="230" class="f"/><line x1="475" y1="230" x2="700" y2="230" class="f"/>
  <line x1="65" y1="145" x2="65" y2="285" class="n"/><line x1="65" y1="285" x2="700" y2="285" class="n"/>
  <line x1="582" y1="160" x2="582" y2="343" class="pe"/><line x1="765" y1="313" x2="765" y2="343" class="pe"/>
  <text x="85" y="313" class="s">Neutro do circuito 2 ligado antes do DR</text>
