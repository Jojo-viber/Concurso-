<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <rect width="900" height="430" fill="#f8fafc"/>
  <style>.t{font:20px Arial;fill:#0f172a}.s{font:17px Arial;fill:#334155}.f{stroke:#b91c1c;stroke-width:5;fill:none}.n{stroke:#2563eb;stroke-width:5;fill:none}.pe{stroke:#15803d;stroke-width:5;fill:none}.box{fill:#fff;stroke:#0f172a;stroke-width:3}</style>
  <text x="25" y="35" class="t">Quadro monofásico com dois circuitos terminais</text>
  <text x="35" y="92" class="t">F</text><line x1="65" y1="85" x2="245" y2="85" class="f"/>
  <text x="35" y="152" class="t">N</text><line x1="65" y1="145" x2="245" y2="145" class="n"/>
