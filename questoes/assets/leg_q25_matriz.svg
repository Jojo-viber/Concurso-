<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><rect width="900" height="340" fill="white"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Matriz de regularidade da atuação</text><g font-family="Arial" font-size="16"><rect x="115" y="65" width="670" height="210" fill="#eef2f7" stroke="#17365d" stroke-width="3"/><path d="M115 115h670M115 165h670M115 215h670M560 65v210" stroke="#829ab8" stroke-width="2"/><text x="145" y="97">Registro profissional ativo</text><text x="145" y="147">Atribuições compatíveis com o escopo</text><text x="145" y="197">ART de cargo ou função</text><text x="145" y="247">ART da obra ou serviço</text><text x="672" y="97" text-anchor="middle" fill="#0b5e42">SIM</text><text x="672" y="147" text-anchor="middle" fill="#c72218">PARCIAL</text><text x="672" y="197" text-anchor="middle" fill="#0b5e42">SIM</text><text x="672" y="247" text-anchor="middle" fill="#c72218">NÃO</text></g><text x="450" y="312" text-anchor="middle" font-family="Arial" font-size="16">Os requisitos são cumulativos, não alternativos.</text></svg>