<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><rect width="900" height="330" fill="white"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Tratamento dos impactos ambientais</text><g font-family="Arial" text-anchor="middle"><rect x="50" y="105" width="220" height="105" rx="10" fill="#e4f5df" stroke="#0b5e42" stroke-width="3"/><text x="160" y="145" font-size="20" font-weight="bold">1. Evitar</text><text x="160" y="177" font-size="17">mudar a intervenção</text><rect x="340" y="105" width="220" height="105" rx="10" fill="#fff0b8" stroke="#8a6d00" stroke-width="3"/><text x="450" y="145" font-size="20" font-weight="bold">2. Reduzir</text><text x="450" y="177" font-size="17">controlar o efeito</text><rect x="630" y="105" width="220" height="105" rx="10" fill="#f3dcf7" stroke="#704078" stroke-width="3"/><text x="740" y="145" font-size="20" font-weight="bold">3. Tratar residual</text><text x="740" y="177" font-size="17">medida equivalente</text></g><g stroke="#17365d" stroke-width="4" fill="#17365d"><path d="M270 157h62M560 157h62"/><path d="M324 149l16 8-16 8M614 149l16 8-16 8"/></g><text x="450" y="270" text-anchor="middle" font-family="Arial" font-size="17">A compensação não substitui a prevenção possível.</text></svg>